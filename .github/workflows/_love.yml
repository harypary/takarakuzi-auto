name: 共通 - 恋愛占い記事の生成と投稿

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Install Playwright and Japanese fonts
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          NOTE_SESSION_B64: ${{ secrets.NOTE_SESSION_B64 }}
        run: python scripts/run_love.py --product "${{ inputs.product }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit data
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: ${{ inputs.product }} $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.product }}-${{ github.run_number }}
          path: output/
          retention-days: 14
