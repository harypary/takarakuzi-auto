name: note セッション更新（毎月10日 9:00 JST）

on:
  schedule:
    - cron: '0 0 10 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: takarakuzi-data
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Renew note.com session
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: python scripts/renew_note_session.py

      - name: Commit encrypted session
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/session
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "session: renew $(date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renew-logs-${{ github.run_number }}
          path: output/logs/
          retention-days: 7
