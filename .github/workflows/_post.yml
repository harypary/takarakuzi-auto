name: 共通 - 予想記事の生成と投稿

on:
  workflow_call:
    inputs:
      series:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright and Japanese fonts
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE_SESSION_B64: ${{ secrets.NOTE_SESSION_B64 }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: python scripts/run_post.py --series "${{ inputs.series }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit data
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: ${{ inputs.series }} $(date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.series }}-${{ github.run_number }}
          path: output/
          retention-days: 14
