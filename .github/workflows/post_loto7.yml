name: ロト7予想 投稿（水 夕方〜21時台・金曜抽せん分）

on:
  schedule:
    # 定時実行は実測で4〜5時間遅れるため、21時台に出るよう16:07 JST(07:07 UTC)に予約する（予備は投稿済みならスキップ）。
    - cron: '7 07 * * 3'
    - cron: '17 09 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takarakuzi-post-loto7
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_post.yml
    with:
      series: loto7
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
