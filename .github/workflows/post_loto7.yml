name: ロト7予想 投稿（水 21:07 JST・金曜抽せん分）

on:
  schedule:
    # 定時実行は遅れることがあるため、:00 を避け、約2時間後に予備の実行を置く（投稿済みならスキップ）。
    - cron: '7 12 * * 3'
    - cron: '17 14 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takarakuzi-post-loto7
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_post.yml
    with:
      series: loto7
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
