name: ナンバーズ3・4予想 投稿（日〜木 21:37 JST・翌日抽せん分）

on:
  schedule:
    # 定時実行は遅れることがあるため、混雑しやすい :00/:30 を避け、約2時間後に予備の実行を置く。
    # 予備の実行は、投稿済みならスキップされる。
    - cron: '37 12 * * 0-4'
    - cron: '47 14 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takarakuzi-post-numbers
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_post.yml
    with:
      series: numbers
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
