name: ナンバーズ3・4予想 投稿（日〜木 夕方〜21時台・翌日抽せん分）

on:
  schedule:
    # GitHub の定時実行は実測で約7時間遅れるため、狙いの21時台に出るよう14:37 JST(05:37 UTC)に予約する。
    # 遅れなかった場合は昼過ぎの投稿になる。予備の実行は投稿済みならスキップされる。
    - cron: '37 05 * * 0-4'
    - cron: '47 07 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takarakuzi-post-numbers
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_post.yml
    with:
      series: numbers
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
