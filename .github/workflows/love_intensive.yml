name: 2週間の恋愛集中鑑定 投稿（隔週木曜・1,980円×12本）

on:
  # 定時実行は love_scheduler.yml に一本化した（1日の公開上限に収めるため）。ここは手動実行用
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: love-intensive
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_love.yml
    with:
      product: intensive
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
