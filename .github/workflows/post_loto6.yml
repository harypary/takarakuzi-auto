name: ロト6予想 投稿（火・土 夕方〜21時台）

on:
  schedule:
    # 土曜 → 月曜抽せん分、火曜 → 木曜抽せん分。
    # 定時実行は実測で約7時間遅れるため、21時台に出るよう14:07 JST(05:07 UTC)に予約する（予備は投稿済みならスキップ）。
    - cron: '7 05 * * 2,6'
    - cron: '17 07 * * 2,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: takarakuzi-post-loto6
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_post.yml
    with:
      series: loto6
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
