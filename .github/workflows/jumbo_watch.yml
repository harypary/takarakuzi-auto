name: 次のジャンボの日程チェック（毎週木曜 10:00 JST）

# 年末ジャンボなどの日程が公式サイトに出たら Issue で知らせる。
# 見つかったら scripts/post_jumbo.py の JUMBO を差し替えて無料記事を出す。

on:
  schedule:
    - cron: '0 1 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-dotenv

      - name: Check official site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_jumbo_announcement.py
