name: 週間恋愛運 投稿（日曜 夕方〜21時台・翌週分・980円×12本）

on:
  # 定時実行は love_scheduler.yml に一本化した（1日の公開上限に収めるため）。ここは手動実行用
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: love-weekly
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_love.yml
    with:
      product: weekly
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
