name: 今日の恋愛運 投稿（毎日 夕方〜21時台・翌日分・300円×12本）

on:
  # 定時実行は love_scheduler.yml に一本化した（1日の公開上限に収めるため）。ここは手動実行用
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: love-daily
  cancel-in-progress: false

jobs:
  post:
    uses: ./.github/workflows/_love.yml
    with:
      product: daily
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
