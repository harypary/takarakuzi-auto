name: 無料コラム 投稿（毎週日曜 夕方〜21時台）

# 3種類（よくある誤解／出目レポート／暦カレンダー）を持ち回りで投稿する。
# 定時実行は実測で約7時間遅れるため、21時台に出るよう 14:07 JST(05:07 UTC) に予約する。

on:
  schedule:
    - cron: '7 05 * * 0'
    - cron: '17 07 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（生成のみ・投稿しない）'
        type: boolean
        default: false
      topic:
        description: '種類（省略時は自動で持ち回り）'
        type: choice
        options: ['', 'myths', 'report', 'koyomi']
        default: ''

permissions:
  contents: write

concurrency:
  group: takarakuzi-column
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Install Playwright and Japanese fonts
        run: |
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate and post
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          NOTE_SESSION_B64: ${{ secrets.NOTE_SESSION_B64 }}
        run: |
          python scripts/post_column.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.topic && format('--topic {0}', inputs.topic) || '' }}

      - name: Commit data
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: column $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: column-${{ github.run_number }}
          path: output/
          retention-days: 14
